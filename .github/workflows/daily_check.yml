name: Daily Exam Tracker

on:
  schedule:
    # 9:00 AM Indian Standard Time (IST) is 3:30 AM Universal Time (UTC)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows you to manually click "Run workflow" anytime to test

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas google-generativeai

      - name: Run Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tracker.py